name: Vyrax
options:
  bundleIdPrefix: com.amyrax
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    MARKETING_VERSION: ${VYRAX_VERSION}
    CURRENT_PROJECT_VERSION: '30'
    DEVELOPMENT_TEAM: ${VYRAX_APPLE_TEAM}
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    OTHER_LDFLAGS: ['-lresolv', '-framework', 'Security']
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTS_MACCATALYST: NO
    'EXCLUDED_ARCHS[sdk=iphonesimulator*]': x86_64
targets:
  Vyrax:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources/ui
        type: folder
        buildPhase: resources
      - path: Resources/geo.bin
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/licenses
        type: folder
        buildPhase: resources
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: VyraxTunnel
      - framework: build/VyraxCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amyrax.vyrax
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Vyrax.entitlements
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': App/Simulator.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VyraxTunnel:
    type: app-extension
    platform: iOS
    sources: [Tunnel, Shared]
    dependencies:
      - framework: build/VyraxCore.xcframework
        embed: false
      - framework: build/HevSocks5Tunnel.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amyrax.vyrax.tunnel
        INFOPLIST_FILE: Tunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tunnel/Vyrax.entitlements
        'CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]': ''
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  VyraxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: ['*.mjs', '*.c']
    dependencies:
      - target: Vyrax
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amyrax.vyrax.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Vyrax:
    build:
      targets:
        Vyrax: all
        VyraxTests: [test]
    test:
      targets: [VyraxTests]
