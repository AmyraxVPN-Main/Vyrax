name: iOS builds and checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Native Firefox provider contracts
        run: |
          swiftc -o /tmp/vyrax-provider-check .tools/selftest/AppleProviderHarness.swift ios/App/FreeCrypto.swift ios/Shared/FreeProvider.swift
          /tmp/vyrax-provider-check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache-dependency-path: ios/Engine/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare Apple build tools
        run: |
          brew install xcodegen
          python3 -m pip install Pillow
          xcodebuild -version
      - name: Shared UI and resource preparation
        run: |
          npm ci --no-audit --no-fund
          npm run build
          node .tools/gen-geo.mjs
          node scripts/collect-licenses.mjs
          python3 scripts/prepare-ios.py
          version=$(node -p 'require("./package.json").version')
          mkdir -p "release/ios-$version"
      - uses: actions/cache/restore@v4
        id: cores
        with:
          key: ios-arm64-cores-${{ hashFiles('ios/Engine/**', 'vendor/ios-versions.json', 'scripts/build-ios-cores.sh') }}
          path: |
            ios/build/VyraxCore.xcframework
            ios/build/HevSocks5Tunnel.xcframework
            ios/build/packet-flow-test
            vendor/ios/sources
            ios/Resources/licenses/core
      - name: Native cores and packet flow verification
        if: steps.cores.outputs.cache-hit != 'true'
        run: bash scripts/build-ios-cores.sh
      - uses: actions/cache/save@v4
        if: steps.cores.outputs.cache-hit != 'true'
        with:
          key: ${{ steps.cores.outputs.cache-primary-key }}
          path: |
            ios/build/VyraxCore.xcframework
            ios/build/HevSocks5Tunnel.xcframework
            ios/build/packet-flow-test
            vendor/ios/sources
            ios/Resources/licenses/core
      - name: Cached core checks
        if: steps.cores.outputs.cache-hit == 'true'
        run: |
          version=$(node -p 'require("./package.json").version')
          ios/build/packet-flow-test | tee "release/ios-$version/packet-flow-tests.txt"
          cd ios/Engine
          go mod verify
          go test -race ./...
      - name: Unsigned device archive and simulator
        run: VYRAX_IOS_UI_READY=1 VYRAX_IOS_CORES_READY=1 bash scripts/build-ios.sh
      - name: Real WebKit host tests on iPhone simulator
        run: bash scripts/test-ios.sh
      - name: Package application and precise dependency sources
        if: success()
        run: |
          version=$(node -p 'require("./package.json").version')
          git archive HEAD -o "release/ios-$version/Vyrax-$version-source.zip"
          ditto -c -k --keepParent vendor/ios/sources "release/ios-$version/Vyrax-$version-ios-core-sources.zip"
          cd "release/ios-$version"
          shasum -a 256 *.zip > SHA256SUMS.txt
      - name: Upload build outputs and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vyrax-iOS-build-and-verification
          path: release/ios-*/
          if-no-files-found: error
          retention-days: 14
