name: android-pow-emulator
on:
  push:
    branches: [vyrax-0.2.4-emulator]
  workflow_dispatch:
jobs:
  pow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and install Vyrax
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: |
            set -x
            adb install -r ci/app.apk
            adb shell pm clear com.amyrax.vyrax || true
            adb shell am start -n com.amyrax.vyrax/com.follow.clash.MainActivity
            sleep 20
            adb exec-out screencap -p > 01-home.png
            for i in 1 2 3 4 5 6 7 8; do adb shell input swipe 160 560 160 140 250; sleep 1; done
            adb exec-out screencap -p > 02-disclaimer.png
            adb shell input tap 232 602
            sleep 3
            adb shell input tap 232 602
            sleep 6
            adb exec-out screencap -p > 03-after-agree.png
            adb shell input tap 160 520
            sleep 2
            adb shell input text "The%sSoftware%sitself%sdoes%snot%sprovide%sany%sproxy%sserver,%snode,%ssubscription,%sor%snetwork%saccess%sservice,%sand%shas%sno%spartnership,%sagency,%sor%sguarantee%srelationship%swith%sany%sprovider%sof%ssuch%sservices."
            sleep 3
            adb shell input tap 231 340
            sleep 10
            adb exec-out screencap -p > 04-dashboard.png
            adb shell input tap 184 194
            sleep 8
            adb exec-out screencap -p > 05-panel.png
            adb logcat -c || true
            adb shell input tap 160 275
            for i in 1 2 3 4 5 6; do
              sleep 40
              echo "=== t=$((i*40))s ===" >> state.txt
              adb shell pidof com.amyrax.vyrax >> state.txt || echo "app-dead" >> state.txt
              adb shell pidof com.amyrax.vyrax:uacpow >> state.txt || echo "engine-dead" >> state.txt
              adb shell dumpsys window | grep mCurrentFocus >> state.txt || true
              adb exec-out screencap -p > 06-connect-$((i*40))s.png
              adb logcat -d -s VyraxPow:V | tail -8 >> state.txt || true
            done
            adb root || true
            adb shell ls -l /data/tombstones > tombstones.txt 2>&1 || true
            adb shell sh -c 'cat /data/tombstones/tombstone_* 2>/dev/null | head -300' > tombstone.txt 2>&1 || true
            adb shell dumpsys activity processes > processes.txt 2>&1 || true
            adb logcat -d > logcat-full.txt || true
            adb shell dmesg > dmesg.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pow-emulator-home
          path: |
            *.png
            *.txt
