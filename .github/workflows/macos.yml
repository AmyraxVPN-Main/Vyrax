name: macOS shared UI 0.1.35 packaging
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: Vyrax-0.1.34-macos-${{ matrix.arch }}-macfix1
          run-id: 38846308074
          github-token: ${{ github.token }}
          path: base
      - name: Verify and restore presentation input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/AmyraxVPN-Main/Vyrax/releases/assets/649007591 -H 'Accept: application/octet-stream' > ui.zip
          python3 - <<'PY'
          import hashlib,zipfile,pathlib
          assert hashlib.sha256(pathlib.Path('ui.zip').read_bytes()).hexdigest()=='baa50ec03ef2ed62bfcbcc138c11fa3a0b945c9c3455a4bac3ad53786e67dafd'
          with zipfile.ZipFile('ui.zip') as z:
              root=pathlib.Path('presentation').resolve()
              assert all((root/n).resolve().is_relative_to(root) for n in z.namelist())
              z.extractall(root)
          PY
          mkdir -p 'macos/build/${{ matrix.arch }}'
          ditto -x -k 'base/Vyrax-0.1.34-macos-${{ matrix.arch }}.zip' 'macos/build/${{ matrix.arch }}'
      - name: Overlay, verify unchanged native files, sign and package
        run: python3 scripts/package-ui-macos.py 'macos/build/${{ matrix.arch }}/Vyrax.app' presentation 'release/macos-0.1.35/${{ matrix.arch }}' '${{ matrix.arch }}'
      - name: Prepare isolated UI test dependency
        run: npm install --prefix macos/build/test-tools --no-audit --no-fund playwright-core@1.64.0
      - name: Native sandbox, clipboard, subscription and RTL verification
        env:
          VYRAX_PLAYWRIGHT_MODULE: ${{ github.workspace }}/macos/build/test-tools/node_modules/playwright-core/index.mjs
        run: node scripts/test-packaged-desktop.mjs 'macos/build/${{ matrix.arch }}/Vyrax.app/Contents/MacOS/Vyrax' 'release/macos-0.1.35/${{ matrix.arch }}/verification'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vyrax-0.1.35-macos-${{ matrix.arch }}
          path: release/macos-0.1.35/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
